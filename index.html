<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tombol Unlock Suara (Hilang setelah diklik) -->
    <div id="audioUnlock" onclick="unlockAudio()">🔊 Klik Layar Untuk Mengaktifkan Suara Adzan & Video</div>

    <!-- Header -->
    <header id="header">
        <!-- Kiri: Tanggal -->
        <div class="header-left">
            <div id="hijriDate"></div>
            <div id="gregDate"></div>
        </div>
        <!-- Tengah: Nama Masjid -->
        <div class="header-center">
            <h1 id="mosqueName">Masjid Raya Al-Muhajirin</h1>
            <p id="mosqueAddress">Jl. Contoh Alamat No. 123, Banten</p>
        </div>
        <!-- Kanan: Jam Digital -->
        <div class="header-right">
            <div id="clock">00:00:00</div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Left Side: Prayer Times -->
        <aside class="left-panel">
            <div class="prayer-container" id="prayerTimes">
                <!-- Diisi via JS -->
            </div>
        </aside>

        <!-- Center: Video/Slideshow -->
        <section class="center-panel">
            <div id="mediaContainer" class="media-container">
                <!-- Diisi via JS -->
            </div>
        </section>
    </main>

    <!-- Footer: Running Text (Blok Terpisah) -->
    <footer>
        <div class="running-block" id="runningText1Block">
            <div class="running-text" id="runningText1"><span>Selamat datang di Masjid kami.</span></div>
        </div>
        <div class="running-block" id="runningText2Block">
            <div class="running-text" id="runningText2"><span>Pengumuman: Majelis Ta'lim ba'da Maghrib.</span></div>
        </div>
    </footer>

    <!-- Audio Elements -->
    <audio id="audioPlayer" src=""></audio>

    <script src="script.js"></script>
</body>
</html>
