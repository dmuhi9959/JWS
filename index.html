<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Masjid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <div class="header-left">
            <h1 id="mosqueName">Masjid Raya Al-Muhajirin</h1>
            <p id="mosqueAddress">Jl. Contoh Alamat No. 123, Banten</p>
        </div>
        <div class="header-right">
            <div id="hijriDate"></div>
            <div id="gregDate"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Left Side: Clock & Prayer Times (Blok Terpisah) -->
        <aside class="left-panel">
            <div id="clock" class="block clock-block">00:00:00</div>
            <div class="prayer-container" id="prayerTimes">
                <!-- Diisi via JS -->
            </div>
        </aside>

        <!-- Center: Video/Slideshow -->
        <section class="center-panel">
            <div id="mediaContainer" class="media-container">
                <!-- Diisi via JS (Youtube atau Gambar) -->
            </div>
        </section>
    </main>

    <!-- Footer: Running Text (Blok Terpisah) -->
    <footer>
        <div class="running-block" id="runningText1Block">
            <div class="running-text" id="runningText1"><span>Selamat datang di Masjid kami.</span></div>
        </div>
        <div class="running-block" id="runningText2Block">
            <div class="running-text" id="runningText2"><span>Pengumuman: Penyelenggaraan Majelis Ta'lim setiap ba'da Maghrib.</span></div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
