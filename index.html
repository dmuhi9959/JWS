<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag berikut mencegah zoom dan membuat pas di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Display Masjid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tombol Unlock Suara & Fullscreen -->
    <div id="audioUnlock" onclick="unlockAudio()">🔊 Klik Di Sini Untuk Fullscreen, Landscape & Mengaktifkan Suara</div>

    <!-- Header -->
    <header id="header">
        <div class="header-left">
            <div id="clock">00:00:00</div>
        </div>
        <div class="header-center">
            <h1 id="mosqueName">Masjid Raya Al-Muhajirin</h1>
            <p id="mosqueAddress">Jl. Contoh Alamat No. 123, Banten</p>
        </div>
        <div class="header-right">
            <div id="hijriDate"></div>
            <div id="gregDate"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <aside class="left-panel">
            <div class="prayer-container" id="prayerTimes"></div>
        </aside>
        <section class="center-panel">
            <div id="mediaContainer" class="media-container"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="running-block" id="runningText1Block">
            <div class="running-text" id="runningText1"><span>Selamat datang di Masjid kami.</span></div>
        </div>
        <div class="running-block" id="runningText2Block">
            <div class="running-text" id="runningText2"><span>Pengumuman: Majelis Ta'lim ba'da Maghrib.</span></div>
        </div>
    </footer>

    <audio id="audioPlayer" src=""></audio>

    <script src="script.js"></script>
</body>
</html>
